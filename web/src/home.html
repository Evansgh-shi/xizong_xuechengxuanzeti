<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="学成西综五科题库：选择课程、章节和专题开始复习。"><title>学成 · 西综题库首页</title>
<style>
:root{color-scheme:light;--ink:#20392b;--green:#194e38;--line:#bccdbb;--muted:#49634e}*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:var(--ink);font:17px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}button,input,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:var(--green)}button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a56c16;outline-offset:4px}[hidden]{display:none!important}.shell{max-width:1150px;margin:auto;padding:0 32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:23px 0;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:800;letter-spacing:3px}.brand span{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--green);color:#e1efca;margin-right:12px;font-size:23px;letter-spacing:0}.release{color:var(--muted);font-size:14px}.intro{padding:38px 0 26px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted)}h1{font-size:37px;line-height:1.4;margin:8px 0 10px}p{margin:0}.intro p{color:var(--muted);font-size:17px}.course-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 28px}.course-tab{text-align:left;padding:17px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);min-width:0}.course-tab strong{display:block;font-size:21px}.course-tab small{display:block;font-size:13px;margin-top:3px}.course-tab[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 16px #194e381a}.catalog-toolbar{display:flex;justify-content:space-between;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h2{font-size:23px;margin:0}.catalog-toolbar p{font-size:14px;color:var(--muted)}.search{border:1px solid #79977f;border-radius:9px;background:#fff;padding:11px 14px;font-size:17px;min-width:290px;max-width:100%;color:var(--ink)}.chapter-section{margin:24px 0 32px}.chapter-section>h3{font-size:17px;color:var(--muted);margin:0 0 12px}.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.chapter-card{background:#fff;border:1px solid var(--line);border-radius:13px;min-width:0;padding:19px;display:flex;flex-direction:column}.chapter-number{font-size:12px;color:var(--muted);letter-spacing:1px}.chapter-card h3{font-size:20px;margin:4px 0;line-height:1.6}.chapter-meta{font-size:14px;color:var(--muted)}.start-chapter{display:block;text-align:center;padding:9px 12px;border-radius:7px;background:#e8f0e3;border:1px solid #94ae92;font-size:16px;font-weight:700;text-decoration:none;margin-top:16px}.chapter-card details{margin-top:13px}.chapter-card summary{font-size:14px;cursor:pointer;color:var(--muted)}.topic-link{display:block;font-size:15px;padding:8px 0;border-top:1px solid #e0e8dc;text-decoration:none;margin-top:6px}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:12px}.resume{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px;border:1px solid #91aa88;border-radius:12px;background:#e8f0e2;margin-bottom:24px}.resume strong{display:block}.resume small{color:var(--muted)}.resume a{font-size:16px;font-weight:700;white-space:nowrap}footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:13px}footer p+p{margin-top:5px}@media(max-width:850px){.chapters{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:0 22px}.course-tabs{gap:9px}.course-tab{padding:13px 12px}}@media(max-width:700px){.shell{padding:0 16px}header{padding:16px 0}.brand{font-size:21px}.brand span{width:35px;height:35px;font-size:19px;margin-right:8px}.intro{padding:27px 0 22px}h1{font-size:28px}.intro p{font-size:16px}.course-tabs{gap:7px;margin-bottom:24px}.course-tab{padding:12px 3px;text-align:center;border-radius:9px}.course-tab strong{font-size:18px}.course-tab small{font-size:11px}.catalog-toolbar{display:block}.catalog-toolbar h2{font-size:22px}.search{width:100%;min-width:0;margin-top:14px}.chapters{grid-template-columns:1fr;gap:12px}.chapter-section{margin:22px 0}.chapter-card{padding:17px}.chapter-card h3{font-size:21px}.chapter-card details{margin-top:12px}.start-chapter{font-size:17px;min-height:45px}.resume{padding:13px 15px}.resume strong{font-size:16px}.resume small{font-size:12px}}
</style></head>
<body><div class="shell"><header><div class="brand"><span>学</span>学成选择题</div><span class="release">__RELEASE_VERSION__ · 西综五科</span></header>
<main><section class="intro"><div class="eyebrow">STUDY BY CHAPTER</div><h1>今天，从哪一章开始？</h1><p>选一门课程，进入章节或专题。手机一题一练，电脑整专题复习。</p></section>
<section class="resume" id="resume" hidden aria-label="继续上次练习"></section>
<nav class="course-tabs" id="courses" aria-label="选择题库"></nav>
<section aria-label="选择章节"><div class="catalog-toolbar"><div><h2 id="course-title"></h2><p id="course-count"></p></div><div class="home-search-box"><input id="chapter-search" class="search" type="search" placeholder="模糊搜索五科章节、专题或简称…" aria-label="搜索章节或知识专题" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions" autocomplete="off"><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="可能的搜索结果" hidden></div><p class="search-help">支持简称、漏字及少量错字，搜索范围为五科章节与专题。</p></div></div><div id="chapter-catalog"></div></section></main>
<footer><p>内科 · 外科 · 生理 · 生化 · 病理，共 6,622 题 · __RELEASE_VERSION__</p><p>答题、错题与收藏保存在当前浏览器，不上传、不自动跨设备同步。仅供考试复习，不替代临床诊疗。</p></footer></div>
<script>
'use strict';
const COURSES=__HOME_CATALOG__;
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URL(location.href).searchParams;
// Keep existing internal-course bookmarks and cross-course practice links valid.
if(['chapter','module','practice','edge'].some(k=>params.has(k)))location.replace('./internal.html'+location.search+location.hash);
let selected=COURSES.find(c=>c.id===params.get('course'))||COURSES[0];
function url(c,ch,m){const u=new URL(c.url,location.href);u.searchParams.set('chapter',ch.id);if(m)u.searchParams.set('module',m.id);u.searchParams.set('start','1');return u.href;}
function record(c){try{return JSON.parse(localStorage.getItem(c.key)||'null')?.state||{};}catch{return {};}}
__HOME_SEARCH__
let searchHits=[],activeSuggestion=-1,searchLimit=40,composing=false,suggestionsDismissed=false;
function searchLink(e){return url(e.course,e.chapter,e.module);}
function renderSuggestions(){const panel=$('search-suggestions'),input=$('chapter-search'),items=searchHits.slice(0,8);panel.hidden=!input.value.trim()||!items.length||suggestionsDismissed;input.setAttribute('aria-expanded',String(!panel.hidden));if(panel.hidden){input.removeAttribute('aria-activedescendant');return;}panel.innerHTML='<p class="suggestions-label">可能的结果 · ↑↓选择，回车进入</p>'+items.map((e,i)=>`<a id="search-option-${i}" class="search-suggestion" role="option" tabindex="-1" aria-selected="${activeSuggestion===i}" href="${esc(searchLink(e))}" data-suggestion="${i}"><strong>${esc(e.name)}</strong><small>${esc(e.course.name)} · ${e.module?esc(e.chapter.name)+' · 专题':'章节'} · ${esc(e.reason)}</small></a>`).join('');if(activeSuggestion>=0){input.setAttribute('aria-activedescendant','search-option-'+activeSuggestion);$('search-option-'+activeSuggestion)?.scrollIntoView({block:'nearest'});}else input.removeAttribute('aria-activedescendant');}
function searchResultsHTML(term){return `<div class="search-summary"><p role="status">“${esc(term)}”的可能结果：${searchHits.length} 项 · 五科跨科搜索</p><button class="clear-search" data-clear-search>清空搜索</button></div>${searchHits.length?'<div class="search-results">'+searchHits.slice(0,searchLimit).map(e=>`<a class="search-hit" href="${esc(searchLink(e))}"><span class="hit-reason">${esc(e.reason)}</span><h3>${esc(e.name)}</h3><small>${esc(e.course.name)} · ${e.module?esc(e.chapter.name)+' · 知识专题':'讲义章节'}${e.chapter.system?' · '+esc(e.chapter.system):''}</small><small>进入${e.module?'本专题':'本章'} →</small></a>`).join('')+'</div>'+(searchHits.length>searchLimit?'<button class="more-search" data-more-search>显示更多可能结果</button>':''):'<div class="empty search-empty" role="status">没有找到足够相近的章节或专题。可减少关键词，或试试“甲亢”“慢阻肺”“肾炎”。</div>'}`;}
function render(){
 $('courses').innerHTML=COURSES.map(c=>`<button class="course-tab" data-course="${c.id}" aria-pressed="${c.id===selected.id}"><strong>${c.name}</strong><small>${c.chapters.length}章 · ${c.chapters.reduce((n,ch)=>n+ch.questions,0)}题</small></button>`).join('');
 $('course-title').textContent=selected.name+'题库';$('course-count').textContent=(selected.id==='humanities'?'人文知识与口诀专项分区 · ':'')+selected.chapters.length+'章 · '+selected.chapters.reduce((n,ch)=>n+ch.questions,0)+'题 · 选择章节开始';
 const term=$('chapter-search').value.trim(),chs=selected.chapters;searchHits=term?HOME_SEARCH.search(term):[];
 $('chapter-catalog').innerHTML=[...new Set(chs.map(ch=>ch.system))].map(system=>`<section class="chapter-section"><h3>${esc(system||selected.name)}</h3><div class="chapters">${chs.filter(ch=>ch.system===system).map(ch=>`<article class="chapter-card"><span class="chapter-number">CHAPTER ${String(selected.chapters.indexOf(ch)+1).padStart(2,'0')}</span><h3>${esc(ch.name)}</h3><p class="chapter-meta">${ch.modules.length} 个专题 · ${ch.questions} 题</p><a class="start-chapter" href="${esc(url(selected,ch))}">开始本章 →</a><details><summary>选择知识专题</summary>${ch.modules.map(m=>`<a class="topic-link" href="${esc(url(selected,ch,m))}">${esc(m.name)} →</a>`).join('')}</details></article>`).join('')}</div></section>`).join('')||'<div class="empty" role="status">没有匹配的章节或专题，试试其他关键词。</div>';
 const r=record(selected),chapter=selected.chapters.find(ch=>ch.id===r.homeChapterId),resume=$('resume');resume.hidden=!chapter;
 if(chapter)resume.innerHTML=`<div><strong>继续上次 · ${esc(selected.name)}</strong><small>${esc(chapter.name)}</small></div><a href="${esc(new URL(selected.url,location.href).href)}">继续练习 →</a>`;
 if(term){$('chapter-catalog').innerHTML=searchResultsHTML(term);$('course-title').textContent='五科搜索结果';$('course-count').textContent='按相近程度排序，可直接进入对应章节或专题';}renderSuggestions();
 const u=new URL(location.href);u.searchParams.set('course',selected.id);history.replaceState(null,'',u);
}
$('courses').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(!b)return;selected=COURSES.find(c=>c.id===b.dataset.course);$('chapter-search').value='';activeSuggestion=-1;render();});
const searchInput=$('chapter-search');
function updateSearch(){activeSuggestion=-1;searchLimit=40;suggestionsDismissed=false;render();}
searchInput.addEventListener('input',()=>{if(!composing)updateSearch();});searchInput.addEventListener('compositionstart',()=>{composing=true;});searchInput.addEventListener('compositionend',()=>{composing=false;updateSearch();});searchInput.addEventListener('focus',()=>{suggestionsDismissed=false;renderSuggestions();});
searchInput.addEventListener('keydown',e=>{if(composing||e.isComposing)return;if(e.key==='Escape'){e.preventDefault();suggestionsDismissed=true;activeSuggestion=-1;renderSuggestions();return;}if(!searchHits.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestionsDismissed=false;const n=Math.min(8,searchHits.length);activeSuggestion=activeSuggestion<0?(e.key==='ArrowDown'?0:n-1):(activeSuggestion+(e.key==='ArrowDown'?1:-1)+n)%n;renderSuggestions();}else if(e.key==='Enter'){e.preventDefault();const hit=searchHits[activeSuggestion<0?0:activeSuggestion];if(hit)location.assign(searchLink(hit));}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.home-search-box')){suggestionsDismissed=true;renderSuggestions();}});$('chapter-catalog').addEventListener('click',e=>{if(e.target.closest('[data-clear-search]')){searchInput.value='';updateSearch();searchInput.focus();}if(e.target.closest('[data-more-search]')){searchLimit+=40;render();}});render();
</script></body></html>

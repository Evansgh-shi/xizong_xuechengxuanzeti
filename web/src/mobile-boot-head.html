<style>
#quiz-loading{display:none}
@media(max-width:700px){html:not(.quiz-ready) body>:is(.wrap,.shell){visibility:hidden!important}html:not(.quiz-ready){background:#f2f5f0}#quiz-loading{display:flex;position:fixed;inset:0;z-index:2147483000;background:#f2f5f0;color:#20392b;align-items:center;justify-content:center;padding:30px;text-align:center;font:16px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;opacity:1;transition:opacity .18s ease}.quiz-ready #quiz-loading{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .18s ease,visibility 0s .18s}.quiz-loading-inner{max-width:310px}.quiz-loading-logo{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:#194e38;color:#e7f2d4;font-size:32px;font-weight:800;margin:0 auto 26px}.quiz-loading-spinner{display:block;width:26px;height:26px;margin:0 auto 19px;border:3px solid #cfddc7;border-top-color:#194e38;border-radius:50%;animation:quiz-loading-turn .8s linear infinite}.quiz-loading-title{font-size:21px;font-weight:750;margin:0 0 8px}.quiz-loading-note{font-size:14px;color:#49634e;margin:0}.quiz-loading-actions{margin-top:22px;display:flex;gap:12px;justify-content:center}.quiz-loading-actions[hidden]{display:none}.quiz-loading-actions button,.quiz-loading-actions a{font:inherit;font-size:15px;border:1px solid #79977f;border-radius:8px;padding:9px 16px;min-height:44px;background:#fff;color:#194e38;cursor:pointer;text-decoration:none}.quiz-loading-actions :focus-visible{outline:3px solid #a56c16;outline-offset:3px}.quiz-loading-error .quiz-loading-spinner{animation:none;border-color:#a8753b}html.quiz-boot-failed body>:is(.wrap,.shell){visibility:hidden!important}}
@keyframes quiz-loading-turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#quiz-loading,.quiz-ready #quiz-loading{transition:none}.quiz-loading-spinner{animation:none;border-color:#194e38 #cfddc7 #cfddc7}}
</style>
<script>
(function(){let done=false,failed=false;const root=document.documentElement;root.classList.add('quiz-booting');function message(error){const el=document.getElementById('quiz-loading');if(!el)return;el.classList.toggle('quiz-loading-error',error);el.querySelector('.quiz-loading-title').textContent=error?'题库暂时未能加载':'题库较大，仍在准备';el.querySelector('.quiz-loading-note').textContent=error?'你的作答保存在本机。请重新加载，或返回题库首页。':'首次加载可能稍慢，请稍候。也可以重新加载。';el.querySelector('.quiz-loading-actions').hidden=false;}
const timer=setTimeout(()=>{if(!done)message(false);},20000);window.QUIZ_BOOT={ready(){if(failed)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(failed)return;done=true;clearTimeout(timer);root.classList.remove('quiz-booting');root.classList.add('quiz-ready');const el=document.getElementById('quiz-loading');if(el){el.setAttribute('aria-hidden','true');el.inert=true;}}));},fail(){if(done)return;failed=true;clearTimeout(timer);root.classList.add('quiz-boot-failed');message(true);}};
window.addEventListener('error',e=>{if(!done&&(e.error||e.target===window))window.QUIZ_BOOT.fail();});window.addEventListener('unhandledrejection',()=>{if(!done)window.QUIZ_BOOT.fail();});document.addEventListener('click',e=>{if(e.target.closest('[data-quiz-reload]'))location.reload();});document.addEventListener('DOMContentLoaded',()=>{if(failed)message(true);});window.addEventListener('pageshow',e=>{if(e.persisted&&done)root.classList.add('quiz-ready');});})();
</script>

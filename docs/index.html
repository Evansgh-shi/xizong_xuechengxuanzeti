 const entries=COURSES.flatMap(c=>c.chapters.flatMap(ch=>[{course:c,chapter:ch,module:null,name:ch.name},...ch.modules.map(m=>({course:c,chapter:ch,module:m,name:m.name}))])).map(e=>({...e,text:normalize(e.name),keywords:normalize((e.module?.keywords||[]).join(' ')),context:normalize(e.course.name+e.chapter.name+e.chapter.system)}));
 for(const e of entries)e.variants=[...new Set([e.text,...aliases.filter(([a,b])=>e.text.includes(normalize(a))||e.keywords.includes(normalize(a))||e.text.includes(normalize(b))).map(([,b])=>normalize(b))])];
 function subsequence(query,text){let at=0,first=-1,last=-1;for(let i=0;i<text.length&&at<query.length;i++)if(text[i]===query[at]){if(first<0)first=i;last=i;at++;}return at===query.length&&last-first+1-query.length<=Math.max(3,query.length*2);}
 function approximate(query,text){let row=Array(text.length+1).fill(0);for(let i=1;i<=query.length;i++){const next=[i];for(let j=1;j<=text.length;j++)next[j]=Math.min(row[j]+1,next[j-1]+1,row[j-1]+(query[i-1]===text[j-1]?0:1));row=next;}return Math.min(...row);}
 function search(raw){let query=normalize(raw).slice(0,80);if(!query)return[];const course=COURSES.find(c=>query.startsWith(normalize(c.name))&&query.length>normalize(c.name).length);if(course)query=query.slice(normalize(course.name).length);const expanded=aliases.filter(([a])=>normalize(a)===query).map(([,b])=>normalize(b));
  const hits=entries.filter(e=>!course||e.course.id===course.id).map(e=>{let score=0,reason='';if(e.text===query){score=120;reason='精确匹配';}else if(e.text.includes(query)){score=105-Math.min(15,e.text.length-query.length);reason='关键词匹配';}else if(expanded.some(a=>e.text.includes(a)||a.includes(e.text)&&e.text.length>=4)||e.variants.slice(1).some(t=>t.includes(query))){score=93;reason='简称／别名';}else if(e.keywords.includes(query)){score=86;reason='相关知识点';}else if(query.length>=3&&e.variants.some(t=>subsequence(query,t))){score=80-Math.min(15,Math.abs(e.text.length-query.length));reason='近似文字';}else if(query.length>=3&&query.length<=32){const d=Math.min(...e.variants.map(t=>approximate(query,t))),allowed=query.length>=6?2:1;if(d<=allowed){score=65-d*8;reason='可能的拼写';}}if(!score&&e.context.includes(query)){score=42;reason='相关章节';}if(!score&&normalize(e.course.name)===query){score=40;reason='课程匹配';}return{...e,score,reason};}).filter(e=>e.score>0).sort((a,b)=>b.score-a.score||(a.module?1:0)-(b.module?1:0)||a.name.length-b.name.length||a.course.id.localeCompare(b.course.id));
  for(const e of hits)if(e.reason==='近似文字')e.score=80-Math.min(15,...e.variants.filter(t=>subsequence(query,t)).map(t=>Math.abs(t.length-query.length)));
  hits.sort((a,b)=>b.score-a.score||(a.module?1:0)-(b.module?1:0)||a.name.length-b.name.length||a.course.id.localeCompare(b.course.id));
  return hits[0]?.score>=85?hits.filter(e=>e.score>=hits[0].score-30):hits;
 }
 return{search,normalize};
})();

let searchHits=[],activeSuggestion=-1,searchLimit=40,composing=false,suggestionsDismissed=false;
function searchLink(e){return url(e.course,e.chapter,e.module);}
function renderSuggestions(){const panel=$('search-suggestions'),input=$('chapter-search'),items=searchHits.slice(0,8);panel.hidden=!input.value.trim()||!items.length||suggestionsDismissed;input.setAttribute('aria-expanded',String(!panel.hidden));if(panel.hidden){input.removeAttribute('aria-activedescendant');return;}panel.innerHTML='<p class="suggestions-label">可能的结果 · ↑↓选择，回车进入</p>'+items.map((e,i)=>`<a id="search-option-${i}" class="search-suggestion" role="option" tabindex="-1" aria-selected="${activeSuggestion===i}" href="${esc(searchLink(e))}" data-suggestion="${i}"><strong>${esc(e.name)}</strong><small>${esc(e.course.name)} · ${e.module?esc(e.chapter.name)+' · 专题':'章节'} · ${esc(e.reason)}</small></a>`).join('');if(activeSuggestion>=0){input.setAttribute('aria-activedescendant','search-option-'+activeSuggestion);$('search-option-'+activeSuggestion)?.scrollIntoView({block:'nearest'});}else input.removeAttribute('aria-activedescendant');}
function searchResultsHTML(term){return `<div class="search-summary"><p role="status">“${esc(term)}”的可能结果：${searchHits.length} 项 · 全科跨科搜索</p><button class="clear-search" data-clear-search>清空搜索</button></div>${searchHits.length?'<div class="search-results">'+searchHits.slice(0,searchLimit).map(e=>`<a class="search-hit" href="${esc(searchLink(e))}"><span class="hit-reason">${esc(e.reason)}</span><h3>${esc(e.name)}</h3><small>${esc(e.course.name)} · ${e.module?esc(e.chapter.name)+' · 知识专题':'讲义章节'}${e.chapter.system?' · '+esc(e.chapter.system):''}</small><small>进入${e.module?'本专题':'本章'} →</small></a>`).join('')+'</div>'+(searchHits.length>searchLimit?'<button class="more-search" data-more-search>显示更多可能结果</button>':''):'<div class="empty search-empty" role="status">没有找到足够相近的章节或专题。可减少关键词，或试试“甲亢”“慢阻肺”“肾炎”。</div>'}`;}
function render(){
 $('courses').innerHTML=COURSES.map(c=>`<button class="course-tab" data-course="${c.id}" aria-pressed="${c.id===selected.id}"><strong>${c.name}</strong><small>${c.chapters.length}章 · ${c.chapters.reduce((n,ch)=>n+ch.questions,0)}题</small></button>`).join('');
 $('course-title').textContent=selected.name+'题库';$('course-count').textContent=(selected.id==='humanities'?'人文知识与口诀专项分区 · ':'')+selected.chapters.length+'章 · '+selected.chapters.reduce((n,ch)=>n+ch.questions,0)+'题 · 选择章节开始';
 const term=$('chapter-search').value.trim(),chs=selected.chapters;searchHits=term?HOME_SEARCH.search(term):[];
 $('chapter-catalog').innerHTML=menuHTML();
 const r=record(selected),chapter=selected.chapters.find(ch=>ch.id===r.homeChapterId),resume=$('resume');resume.hidden=!chapter;
 if(chapter)resume.innerHTML=`<div><strong>继续上次 · ${esc(selected.name)}</strong><small>${esc(chapter.name)}</small></div><a href="${esc(new URL(selected.url,location.href).href)}">继续练习 →</a>`;
 if(term){$('chapter-catalog').innerHTML=searchResultsHTML(term);$('course-title').textContent='全科搜索结果';$('course-count').textContent='按相近程度排序，可直接进入对应章节或专题';}renderSuggestions();
 const u=new URL(location.href);u.searchParams.set('course',selected.id);history.replaceState(null,'',u);
}
$('courses').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(!b)return;selected=COURSES.find(c=>c.id===b.dataset.course);$('chapter-search').value='';activeSuggestion=-1;render();});
const searchInput=$('chapter-search');
function updateSearch(){activeSuggestion=-1;searchLimit=40;suggestionsDismissed=false;render();}
searchInput.addEventListener('input',()=>{if(!composing)updateSearch();});searchInput.addEventListener('compositionstart',()=>{composing=true;});searchInput.addEventListener('compositionend',()=>{composing=false;updateSearch();});searchInput.addEventListener('focus',()=>{suggestionsDismissed=false;renderSuggestions();});
searchInput.addEventListener('keydown',e=>{if(composing||e.isComposing)return;if(e.key==='Escape'){e.preventDefault();suggestionsDismissed=true;activeSuggestion=-1;renderSuggestions();return;}if(!searchHits.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestionsDismissed=false;const n=Math.min(8,searchHits.length);activeSuggestion=activeSuggestion<0?(e.key==='ArrowDown'?0:n-1):(activeSuggestion+(e.key==='ArrowDown'?1:-1)+n)%n;renderSuggestions();}else if(e.key==='Enter'){e.preventDefault();const hit=searchHits[activeSuggestion<0?0:activeSuggestion];if(hit)location.assign(searchLink(hit));}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.home-search-box')){suggestionsDismissed=true;renderSuggestions();}});$('chapter-catalog').addEventListener('click',e=>{if(e.target.closest('[data-clear-search]')){searchInput.value='';updateSearch();searchInput.focus();}if(e.target.closest('[data-more-search]')){searchLimit+=40;render();}});
$('chapter-catalog').addEventListener('change',e=>{const id=e.target.id;if(!['home-system','home-chapter','home-topic'].includes(id))return;const {choice}=menuSelection();if(id==='home-system'){choice.system=e.target.value;choice.chapter='';choice.module='';}if(id==='home-chapter'){choice.chapter=e.target.value;choice.module='';}if(id==='home-topic')choice.module=e.target.value;render();$(id)?.focus({preventScroll:true});});render();

function render(){
 $('courses').innerHTML=COURSES.map(c=>`<button class="course-tab" data-course="${c.id}" aria-pressed="${c.id===selected.id}"><strong>${c.name}</strong><small>${c.chapters.length}章 · ${c.chapters.reduce((n,ch)=>n+ch.questions,0)}题</small></button>`).join('');
 $('course-title').textContent=selected.name+'题库';$('course-count').textContent=selected.chapters.length+'章 · '+selected.chapters.reduce((n,ch)=>n+ch.questions,0)+'题 · 选择章节开始';
 const term=$('chapter-search').value.trim().toLowerCase(),chs=selected.chapters.filter(ch=>(ch.name+' '+ch.system+' '+ch.modules.map(m=>m.name).join(' ')).toLowerCase().includes(term));
 $('chapter-catalog').innerHTML=[...new Set(chs.map(ch=>ch.system))].map(system=>`<section class="chapter-section"><h3>${esc(system||selected.name)}</h3><div class="chapters">${chs.filter(ch=>ch.system===system).map(ch=>`<article class="chapter-card"><span class="chapter-number">CHAPTER ${String(selected.chapters.indexOf(ch)+1).padStart(2,'0')}</span><h3>${esc(ch.name)}</h3><p class="chapter-meta">${ch.modules.length} 个专题 · ${ch.questions} 题</p><a class="start-chapter" href="${esc(url(selected,ch))}">开始本章 →</a><details><summary>选择知识专题</summary>${ch.modules.map(m=>`<a class="topic-link" href="${esc(url(selected,ch,m))}">${esc(m.name)} →</a>`).join('')}</details></article>`).join('')}</div></section>`).join('')||'<div class="empty" role="status">没有匹配的章节或专题，试试其他关键词。</div>';
 const r=record(selected),chapter=selected.chapters.find(ch=>ch.id===r.homeChapterId),resume=$('resume');resume.hidden=!chapter;
 if(chapter)resume.innerHTML=`<div><strong>继续上次 · ${esc(selected.name)}</strong><small>${esc(chapter.name)}</small></div><a href="${esc(new URL(selected.url,location.href).href)}">继续练习 →</a>`;
 const u=new URL(location.href);u.searchParams.set('course',selected.id);history.replaceState(null,'',u);
}
$('courses').addEventListener('click',e=>{const b=e.target.closest('[data-course]');if(!b)return;selected=COURSES.find(c=>c.id===b.dataset.course);$('chapter-search').value='';render();});$('chapter-search').addEventListener('input',render);render();
</script></body></html>
